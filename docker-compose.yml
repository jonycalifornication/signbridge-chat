services:
  avatar-widget:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_API_KEY: ${VITE_API_KEY:-}
        VITE_LANGUAGE_ID: ${VITE_LANGUAGE_ID:-kz_KSL}
    ports:
      - "5174:80"
    environment:
      # Backend URL for API proxy (signBridgeStorage)
      - BACKEND_URL=${BACKEND_URL:-http://host.docker.internal:8000}
      # Internal URL for video renderer
      - RENDERER_URL=http://avatar-renderer:3000

    # ✅ Нужно для Linux-сервера, чтобы host.docker.internal резолвился
    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: always

  avatar-renderer:
    build:
      context: .
      dockerfile: Dockerfile.renderer
    environment:
      # URL where renderer can reach the static files
      - APP_URL=http://avatar-widget:80
      # GPU-accelerated encoding (auto-detected at runtime)
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - ./sessions.json:/app/sessions.json
      - ./video_cache:/app/video_cache
      - ./temp_videos:/app/temp_videos
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video, compute, utility]

