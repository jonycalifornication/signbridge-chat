services:
  avatar-widget:
    build: .
    ports:
      - "5173:80"
    environment:
      # Backend URL for API proxy (signBridgeStorage)
      - BACKEND_URL=http://host.docker.internal:8000

    # ✅ Нужно для Linux-сервера, чтобы host.docker.internal резолвился
    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: always
