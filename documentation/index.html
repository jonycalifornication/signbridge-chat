<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignBridge Docs</title>
    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- Markdown Parser & Highlight.js dependencies (via CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark-dimmed.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

    <style>
        :root {
            --bg: #09090b;
            --bg-sidebar: #18181b;
            --border: #27272a;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
        }

        body {
            margin: 0;
            display: flex;
            height: 100vh;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            overflow: hidden;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 280px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 24px;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: white;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .menu-link {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            margin-bottom: 8px;
            border-radius: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
            user-select: none;
        }

        .menu-link:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        .menu-link.active {
            background-color: rgba(59, 130, 246, 0.15);
            color: var(--primary);
        }

        /* Content Styling */
        .content-container {
            flex: 1;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .content {
            max-width: 800px;
            margin: 0 auto;
            padding: 64px 32px;
            font-size: 16px;
            line-height: 1.7;
        }

        h1,
        h2,
        h3 {
            color: white;
            margin-top: 2em;
            margin-bottom: 0.8em;
        }

        h1 {
            font-size: 2.5em;
            margin-top: 0;
        }

        h2 {
            font-size: 1.8em;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        a {
            color: var(--primary);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        pre {
            background-color: #121214;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            overflow-x: auto;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
        }

        code {
            font-family: 'Fira Code', monospace;
            background-color: #27272a;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
        }

        pre code {
            background-color: transparent;
            padding: 0;
        }

        blockquote {
            background-color: rgba(59, 130, 246, 0.1);
            border-left: 4px solid var(--primary);
            margin: 1.5em 0;
            padding: 16px;
            border-radius: 0 8px 8px 0;
            color: #bfdbfe;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 24px 0;
        }

        th,
        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }

        th {
            background-color: rgba(255, 255, 255, 0.02);
            font-weight: 600;
            color: white;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
        }

        ::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #52525b;
        }

        /* Loading skeleton */
        .loading {
            color: var(--text-muted);
            font-size: 1.2rem;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.6;
            }
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <a href="/" class="logo">
            <span style="font-size: 24px;">🤟</span>
            SignBridge Docs
        </a>

        <div
            style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px; padding-left: 16px; letter-spacing: 1px; text-transform: uppercase;">
            Документация</div>

        <div class="menu-link" id="tab-integration" onclick="window.setPage('integration')">
            <span>🚀</span> <span style="margin-left:8px;">Интеграция</span>
        </div>
        <div class="menu-link" id="tab-api" onclick="window.setPage('api')">
            <span>📜</span> <span style="margin-left:8px;">API Справочник</span>
        </div>
    </div>

    <div class="content-container">
        <div class="content" id="markdown-body">
            <!-- Markdown content will be rendered here -->
            <div class="loading">Загрузка документации...</div>
        </div>
    </div>

    <script type="module" src="./main.js"></script>
</body>

</html>
