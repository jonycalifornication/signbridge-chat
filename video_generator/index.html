<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignBridge | Видеогенератор</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --accent: #000000;
            --accent-hover: #374151;
            --surface: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
        }

        .header-nav {
            position: absolute;
            top: 2rem;
            left: 2rem;
        }

        .header-nav a {
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }
        
        .header-nav a:hover {
            color: var(--accent);
        }

        .app-container {
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 3rem;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        h2 {
            font-size: 1.875rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-main);
            text-align: center;
            letter-spacing: -0.025em;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        textarea {
            width: 100%;
            background: #f9fafb;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            line-height: 1.5;
            resize: vertical;
            min-height: 120px;
            transition: all 0.2s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--text-muted);
            background: #ffffff;
        }

        textarea::placeholder {
            color: #9ca3af;
        }

        select {
            width: 100%;
            background: #f9fafb;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            transition: all 0.2s ease;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1em;
        }

        select:focus {
            outline: none;
            border-color: var(--text-muted);
            background-color: #ffffff;
        }
        
        .input-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        button {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 1rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            /* Упругая пружинная анимация для ВАУ-эффекта */
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        button:hover:not(:disabled) {
            background: var(--accent-hover);
            transform: scale(1.02) translateY(-2px);
            box-shadow: 0 12px 20px -8px rgba(0,0,0,0.4);
        }

        button:active:not(:disabled) {
            transform: scale(0.95);
        }

        button:disabled {
            background: #f3f4f6;
            color: #9ca3af;
            cursor: not-allowed;
            border: 1px solid var(--border-color);
            box-shadow: none;
            transform: none !important;
        }

        /* Generation Status Overlay */
        #loading-area {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            margin-top: 2rem;
            padding: 1.5rem;
            background: #f9fafb;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .status-text-content {
            display: inline-block;
        }

        .status-text {
            font-size: 0.9rem;
            color: var(--text-main);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden; /* Для красивой типографики SSE */
        }
        
        /* Spinner */
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid var(--text-muted);
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }
        
        .btn-spinner {
            border-color: white;
            border-bottom-color: transparent;
        }
        
        .btn-spinner-disabled {
            border-color: #9ca3af;
            border-bottom-color: transparent;
        }
        
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .progress-container {
            width: 100%;
            height: 6px;
            background: var(--border-color);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            /* Shimmer liquid gradient effect */
            background: linear-gradient(90deg, #111827 0%, #6b7280 50%, #111827 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite linear;
            width: 0%;
            border-radius: 999px;
            /* Плавное iOS-заполнение */
            transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Result Area */
        #result-container {
            display: none;
            opacity: 0;
            transition: opacity 0.4s ease;
            margin-top: 2rem;
            flex-direction: column;
            align-items: center;
        }

        .video-wrapper {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #f9fafb;
            border: 1px solid var(--border-color);
            margin-bottom: 1.5rem;
        }
        
        video {
            width: 100%;
            display: block;
            outline: none;
        }

        #download-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0.75rem 1.5rem;
            background: #ffffff;
            color: var(--text-main);
            text-decoration: none;
            border-radius: 10px;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            border: 1px solid var(--border-color);
        }

        #download-link:hover {
            background: #f9fafb;
            border-color: var(--text-muted);
        }

        #download-link svg {
            width: 18px;
            height: 18px;
        }
    </style>
</head>
<body>
    <div class="header-nav">
        <a href="/">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Назад
        </a>
    </div>

    <div class="app-container">
        <h2>Генератор видео</h2>
        <p class="subtitle">Искусственный интеллект преобразует текст в плавную 3D-анимацию. Введите глоссы через пробел.</p>
        
        <div class="input-group">
            <label class="input-label" for="gloss-input">Текст глоссов</label>
            <textarea id="gloss-input" placeholder="Например: HELLO WORLD ALAQAN"></textarea>
        </div>
        
        <div class="input-group">
            <label class="input-label" for="bg-color-select">Цвет фона</label>
            <select id="bg-color-select">
                <option value="white">Белый (White)</option>
                <option value="#00FF00">Зеленый экран (Chroma Key)</option>
                <option value="#1F2937">Темно-серый (Dark)</option>
                <option value="#E5E7EB">Светло-серый (Light Gray)</option>
                <option value="transparent">Прозрачный (Alpha)</option>
            </select>
        </div>
        
        <button id="generate-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            Создать анимацию
        </button>

        <div id="loading-area">
            <div class="status-header">
                <div class="status-text">
                    <span class="spinner" id="loading-spinner"></span>
                    <span id="status-message" class="status-text-content">Инициализация на сервере...</span>
                </div>
                <span id="progress-percentage" style="font-size: 0.85rem; color: var(--text-muted); font-weight: 500;">0%</span>
            </div>
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>

        <div id="result-container">
            <div class="video-wrapper">
                <video id="output-video" controls playsinline></video>
            </div>
            <a id="download-link" download="animation.mp4">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                Сохранить
            </a>
        </div>
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
