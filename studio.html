<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Студия записи - SignBridge</title>
    <link rel="stylesheet" href="/src/studio.css">
</head>

<body>
    <div class="studio-wrapper">
        <!-- Компактная панель управления в одну строку -->
        <div class="compact-toolbar">
            <!-- Фоны - квадратики -->
            <div class="bg-selector">
                <button class="bg-btn active" data-bg="green" title="Зеленый хромакей"
                    style="background: #00ff00;"></button>
                <button class="bg-btn" data-bg="transparent" title="Прозрачный">
                    <div class="transparent-pattern"></div>
                </button>
                <button class="bg-btn color-picker-btn" data-bg="color" title="Выбрать цвет">
                    <input type="color" id="color-picker" value="#1a1a2e" />
                    <span class="color-icon">🎨</span>
                </button>
                <button class="bg-btn" data-bg="white" title="Белый" style="background: white;"></button>
                <button class="bg-btn" data-bg="custom" title="Своё изображение">📁</button>
                <input type="file" id="bg-file" accept="image/*" style="display: none;" />
            </div>

            <div class="toolbar-divider"></div>

            <!-- Выбор аватара -->
            <select id="avatar-select" class="format-select">
                <option value="Ainaz">Ainaz</option>
                <option value="Aibek" selected>Aibek</option>
            </select>


            <!-- Quality -->
            <select id="quality-select" class="format-select">
                <option value="1080">1080p</option>
                <option value="720" selected>720p</option>
                <option value="480">480p</option>
            </select>

            <!-- Соотношение сторон -->
            <select id="aspect-select" class="format-select">
                <option value="16:9" selected>16:9</option>
                <option value="4:3">4:3</option>
                <option value="1:1">1:1</option>
            </select>

            <div class="toolbar-divider"></div>

            <!-- Кнопка записи - красная -->
            <button id="record-btn" class="record-btn" title="Начать запись">
                <span class="record-icon"></span> Записать
            </button>

            <button id="download-btn" class="download-btn" style="display: none;">
                ⬇️ Скачать
            </button>

            <!-- Прогресс -->
            <div id="progress-bar" class="progress-inline" style="display: none;">
                <div id="progress-fill"></div>
                <span id="progress-text">0%</span>
            </div>
        </div>

        <!-- Превью с video controls -->
        <div class="preview-section">
            <div id="studio-avatar-container" class="avatar-preview">
                <!-- Video controls overlay -->
                <div class="video-controls" id="video-controls" style="display: none;">
                    <!-- Timeline -->
                    <div class="timeline-container">
                        <div class="timeline" id="timeline">
                            <div class="timeline-progress" id="timeline-progress"></div>
                            <div class="timeline-markers" id="timeline-markers"></div>
                            <div class="timeline-handle" id="timeline-handle"></div>
                        </div>
                    </div>

                    <!-- Controls -->
                    <div class="controls-overlay">
                        <button class="ctrl-btn" id="play-btn" title="Воспроизвести">▶</button>
                        <button class="ctrl-btn" id="pause-btn" title="Пауза" style="display: none;">⏸</button>

                        <select class="speed-select" id="speed-select" title="Скорость">
                            <option value="0.25">0.25x</option>
                            <option value="0.5">0.5x</option>
                            <option value="1" selected>1x</option>
                            <option value="1.5">1.5x</option>
                            <option value="2">2x</option>
                        </select>

                        <button class="ctrl-btn" id="loop-btn" title="Зациклить">🔁</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Поле ввода глоссов снизу -->
        <div class="glosses-section">
            <label for="glosses-input">
                <strong>📝 Глоссы (последовательность анимаций)</strong>
                <small>Введите слова через пробел заглавными буквами. Например: HELLO IDLE</small>
            </label>
            <textarea id="glosses-input" placeholder="HELLO IDLE HELLO" rows="2"></textarea>
            <div id="glosses-preview" class="glosses-preview"></div>
        </div>
    </div>

    <script type="module" src="/src/studio/index.js"></script>
</body>

</html>
