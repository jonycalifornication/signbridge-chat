<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignBridge Avatar Embed</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            /* Делает фон прозрачным для iframe */
        }

        #avatar-widget-container,
        #avatar-widget-container.compact,
        #avatar-widget-container.expanded {
            width: 100% !important;
            height: 100% !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            box-shadow: none !important;
            background: transparent !important;
            transform: none !important;
            border-radius: 0 !important;
            pointer-events: none !important;
        }

        /* Скрываем кнопку крестика, если она есть, так как в iframe она не нужна */
        .widget-close-btn {
            display: none !important;
        }

    </style>
</head>

<body>
    <div id="avatar-widget-container"></div>
    <script type="module" src="/src/widget/index.js"></script>
    <script>
        // Слушаем сообщения (команды) от родительского окна (другого контейнера)
        window.addEventListener('message', async (event) => {
            if (window.avatarWidget && event.data) {
                try {
                    if (event.data.type === 'TEXT_SELECTION') {
                        // Pass to the text selection handler logic manually 
                        // by temporarily overriding selection, or pulling out the logic
                        // Since we can't easily mock window.getSelection here, 
                        // let's do a quick lookup over CONFIG
                        const selectedText = event.data.text;
                        const CONFIG = window.avatarWidget.constructor.CONFIG || window.CONFIG || { animations: {} };

                        // We need the raw animations object. 
                        // The easiest way is to let the widget expose a method or 
                        // just send the word directly as an animation if it exists.
                        // Let's call a new method on avatarWidget if we add it, or inline the logic:
                        if (window.avatarWidget.processTextSelection) {
                            await window.avatarWidget.processTextSelection(selectedText);
                        } else {
                            // Fallback
                            await window.avatarWidget.playFromJSON({ animation: selectedText });
                        }
                    } else if (event.data.action === 'PLAY_TEXT' && event.data.payload) {
                        // Support for legacy frontends sending { action: "PLAY_TEXT", payload: { text: "..." } }
                        const selectedText = event.data.payload.text || event.data.payload.animation || '';
                        if (selectedText && window.avatarWidget.processTextSelection) {
                            await window.avatarWidget.processTextSelection(selectedText);
                        } else if (selectedText) {
                            await window.avatarWidget.playFromJSON({ animation: selectedText });
                        }
                    } else {
                        // Ожидаем JSON формат как в playFromJSON
                        await window.avatarWidget.playFromJSON(event.data);
                    }
                    // Уведомляем родительское окно об окончании анимации
                    window.parent.postMessage({ type: 'AVATAR_ANIMATION_DONE' }, '*');
                } catch (e) {
                    console.error('Avatar Widget Error:', e);
                }
            }
        });
    </script>
</body>

</html>
