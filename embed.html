<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignBridge Avatar Embed</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            /* Делает фон прозрачным для iframe */
        }

        #avatar-widget-container,
        #avatar-widget-container.compact,
        #avatar-widget-container.expanded {
            width: 100% !important;
            height: 100% !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            box-shadow: none !important;
            background: transparent !important;
            transform: none !important;
            border-radius: 0 !important;
            pointer-events: none !important;
        }

        /* Скрываем кнопку крестика, если она есть, так как в iframe она не нужна */
        .widget-close-btn {
            display: none !important;
        }
    </style>
</head>

<body>
    <div id="avatar-widget-container"></div>
    <script type="module" src="/src/widget/index.js"></script>
    <script>
        // Слушаем сообщения (команды) от родительского окна (другого контейнера)
        window.addEventListener('message', async (event) => {
            if (window.avatarWidget && event.data) {
                try {
                    // Ожидаем JSON формат как в playFromJSON
                    await window.avatarWidget.playFromJSON(event.data);
                    // Уведомляем родительское окно об окончании анимации
                    window.parent.postMessage({ type: 'AVATAR_ANIMATION_DONE' }, '*');
                } catch (e) {
                    console.error('Avatar Widget Error:', e);
                }
            }
        });
    </script>
</body>

</html>
