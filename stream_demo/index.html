<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Stream Animation Demo - SignBridge</title>
    <link rel="stylesheet" href="/src/styles/shared.css">
    <style>
        /* Specific Fixes */
        #json-output {
            font-family: monospace;
            height: 150px;
            resize: vertical;
            margin-bottom: 8px;
        }

        .conversion-step {
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .conversion-step:last-child {
            border-bottom: none;
        }

        .step-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
            display: block;
        }

        .stats {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="/" class="back-link">← Home</a>
                <h2 class="sidebar-title">Binary Stream</h2>
            </div>

            <div class="sidebar-content">
                <!-- Step 1 -->
                <div class="conversion-step">
                    <span class="step-title">1. Encode (Client-side sim)</span>
                    <div class="control-group">
                        <select id="anim-select" class="form-select">
                            <option value="">Select Animation...</option>
                        </select>
                        <button id="convert-btn" class="btn btn-secondary">
                            ⚙️ Convert to Slim JSON
                        </button>
                        <div class="stats" id="conversion-stats"></div>
                    </div>
                </div>

                <!-- Step 2 -->
                <div class="conversion-step">
                    <span class="step-title">2. Response Payload</span>
                    <div class="control-group">
                        <textarea id="json-output" class="form-textarea"
                            placeholder="Generated JSON will appear here..."></textarea>
                        <button id="copy-btn" class="btn btn-secondary" style="font-size: 12px; padding: 6px;">📋 Copy
                            to Clipboard</button>
                    </div>
                </div>

                <!-- Step 3 -->
                <div class="conversion-step">
                    <span class="step-title">3. Playback</span>
                    <div class="control-group">

                        <button id="play-stream-btn" class="btn btn-primary">
                            ▶ Play Stream
                        </button>
                    </div>
                </div>

            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div id="avatar-container" class="canvas-container" style="width: 100%; height: 100%;"></div>
        </main>
    </div>

    <!-- Import Map for Three.js (Required as Stream Demo uses loose imports in some modules if not bundled) -->
    <!-- Ideally we should rely on relative imports like other demos, checking demo.js imports -->
    <!-- Checking demo.js: It imports * as THREE from 'three'. If using vanilla ES modules in browser without build step, we need import map. -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/examples/jsm/loaders/GLTFLoader.js": "https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js",
                "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3.0.0/lib/three-vrm.module.js"
            }
        }
    </script>
    <script type="module" src="./demo.js"></script>
</body>

</html>
