name: Deploy

on:
  push:
    branches:
      - prod
  workflow_dispatch:

jobs:
  deploy:
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout (private repo via PAT, prod branch)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_PAT }}
          ref: prod
          fetch-depth: 1

      - name: Remove git metadata before upload
        run: |
          rm -rf .git
          rm -rf .github || true

      - name: Upload project to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "."
          target: ${{ secrets.SERVER_APP_DIR }}
          overwrite: true
          # ВАЖНО: rm:true удаляет папку целиком => сносит .env
          rm: false

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.2
        env:
          SERVER_APP_DIR: ${{ secrets.SERVER_APP_DIR }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: SERVER_APP_DIR
          command_timeout: 30m
          script: |
            set -e
            cd "$SERVER_APP_DIR"

            echo "Checking .env..."
            if [ ! -f .env ]; then
              echo ".env missing, restoring..."
              if [ -f .env.backup ]; then
                cp .env.backup .env
                echo ".env restored from backup"
              elif [ -f .env.example ]; then
                cp .env.example .env
                echo "ERROR: .env создан из .env.example, но AVATAR_API_KEY пуст — compose не стартует."
                echo "Пропиши ключ в $SERVER_APP_DIR/.env и запусти деплой заново."
                exit 1
              else
                echo "ERROR: no .env, no .env.backup, no .env.example"
                exit 1
              fi
            fi

            # Базовый compose явно (чтобы не подхватился docker-compose.override.yml).
            # На хосте с NVIDIA дополнительно накладываем GPU-оверлей — без него
            # рендер уходит на CPU/SwiftShader и становится в разы медленнее.
            COMPOSE="-f docker-compose.yml"
            if [ -e /dev/nvidia0 ]; then
              COMPOSE="$COMPOSE -f docker-compose.gpu.yml"
              echo "NVIDIA обнаружена — включаю GPU-оверлей"
            else
              echo "GPU не найдена — рендер пойдёт на CPU"
            fi

            docker compose $COMPOSE up -d --build --remove-orphans --force-recreate
            docker compose $COMPOSE ps

            CID="$(docker compose $COMPOSE ps -q avatar-widget || true)"
            if [ -z "$CID" ]; then
              echo "Container for service 'avatar-widget' not found."
              docker compose $COMPOSE logs --no-color --tail=200
              exit 1
            fi

            STATUS="$(docker inspect -f '{{.State.Status}}' "$CID" 2>/dev/null || true)"
            if [ "$STATUS" != "running" ]; then
              echo "Container is not running. Status: $STATUS"
              docker compose $COMPOSE logs --no-color --tail=200
              exit 1
            fi

            HEALTHCHECK_URL="http://127.0.0.1:5173"
            for i in $(seq 1 20); do
              if curl -fsS "$HEALTHCHECK_URL" >/dev/null; then
                echo "OK: $HEALTHCHECK_URL отвечает"
                exit 0
              fi
              sleep 3
            done

            echo "Timeout waiting for $HEALTHCHECK_URL"
            docker compose $COMPOSE logs --no-color --tail=200
            exit 1