name: Deploy

on:
  push:
    branches:
      - prod
  workflow_dispatch:

jobs:
  deploy:
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout (private repo via PAT, prod branch)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_PAT }}
          ref: prod
          fetch-depth: 1

      - name: Upload project to server (without .git)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # ВАЖНО: не копируем ".", чтобы не тащить .git и не ловить Permission denied
          source: Dockerfile,docker-compose.yml,package.json,package-lock.json,pnpm-lock.yaml,yarn.lock,vite.config.js,vitest.config.js,index.html,embed.html,src,public,docs,documentation,studio,widget-demo.html,widget_demo,options.md,README.md,instruction.md,headless-renderer.html,mobile_demo,quaternion_demo,stream_demo,test-vr,test-vrma.html,tests,uv.lock,pyproject.toml
          target: ${{ secrets.SERVER_APP_DIR }}
          overwrite: true

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.2
        env:
          SERVER_APP_DIR: ${{ secrets.SERVER_APP_DIR }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: SERVER_APP_DIR
          command_timeout: 30m
          script: |
            set -e
            cd "$SERVER_APP_DIR"

            # Запускаем ТОЛЬКО базовый compose, чтобы НЕ подхватился docker-compose.override.yml (dev)
            docker compose -f docker-compose.yml up -d --build --remove-orphans --force-recreate
            docker compose -f docker-compose.yml ps

            CID="$(docker compose -f docker-compose.yml ps -q avatar-widget || true)"
            if [ -z "$CID" ]; then
              echo "Container for service 'avatar-widget' not found."
              docker compose -f docker-compose.yml logs --no-color --tail=200
              exit 1
            fi

            STATUS="$(docker inspect -f '{{.State.Status}}' "$CID" 2>/dev/null || true)"
            if [ "$STATUS" != "running" ]; then
              echo "Container is not running. Status: $STATUS"
              docker compose -f docker-compose.yml logs --no-color --tail=200
              exit 1
            fi

            # HTTP check (порт 8080 проброшен на 80 в контейнер)
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:8080 >/dev/null; then
                echo "OK: http://127.0.0.1:8080 отвечает"
                exit 0
              fi
              sleep 3
            done

            echo "Timeout waiting for http://127.0.0.1:8080"
            docker compose -f docker-compose.yml logs --no-color --tail=200
            exit 1