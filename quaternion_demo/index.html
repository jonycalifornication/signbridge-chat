<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quaternion Visualizer - SignBridge</title>
    <link rel="stylesheet" href="/src/styles/shared.css">
    <style>
        /* Quaternion Demo Specifics */
        .workspace {
            display: flex;
            height: 100vh;
            width: 100%;
            overflow: hidden;
        }

        /* Middle Canvas */
        .canvas-area {
            flex: 1;
            position: relative;
            background: #e5e5e5;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
        }

        /* Right Data Panel */
        .data-panel {
            width: 350px;
            background: white;
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            font-size: 12px;
        }

        .data-header {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            background: #f9fafb;
        }

        .table-container {
            flex: 1;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 8px;
            background: #f3f4f6;
            position: sticky;
            top: 0;
        }

        td {
            padding: 6px 8px;
            border-bottom: 1px solid #eee;
            font-family: monospace;
        }

        tr:hover {
            background: #f0f9ff;
        }

        .selected-row {
            background: #dbeafe !important;
        }

        /* Timeline Overlay */
        .timeline-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.9);
            padding: 12px;
            border-top: 1px solid #ddd;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #animation-slider {
            flex: 1;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- Left Sidebar: Controls -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="/" class="back-link">← Home</a>
                <h2 class="sidebar-title">Quaternion Debug</h2>
            </div>

            <div class="sidebar-content">
                <div class="control-group">
                    <label class="control-label">Search / Select Animation</label>
                    <input type="text" id="gloss-search" class="form-input" placeholder="Search..." style="margin-bottom: 8px; width: 100%; padding: 6px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
                    <select id="animation-select" class="form-select" size="8" style="width: 100%;">
                        <option value="" disabled selected>Loading...</option>
                    </select>
                </div>

                <div class="control-group">
                    <label class="control-label">Playback</label>
                    <div style="display: flex; gap: 8px;">
                        <button id="prev-frame" class="btn btn-secondary" title="Prev Frame">◀</button>
                        <button id="play-pause-btn" class="btn btn-primary" style="flex: 1;">Play</button>
                        <button id="next-frame" class="btn btn-secondary" title="Next Frame">▶</button>
                    </div>
                </div>

                <hr style="border: 0; border-top: 1px solid var(--border-color); width: 100%;">

                <div class="control-group">
                    <label class="control-label">Export Data</label>
                    <button id="export-frame-btn" class="btn btn-secondary"
                        style="width: 100%; justify-content: start;">
                        ⬇ Current Frame CSV
                    </button>
                    <button id="export-anim-btn" class="btn btn-secondary"
                        style="width: 100%; justify-content: start; margin-top: 8px;">
                        ⬇ Full Animation CSV
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Content (Canvas + Data Table) -->
        <main class="main-content" style="display: flex; flex-direction: row;">

            <!-- Canvas -->
            <div class="canvas-area">
                <div id="canvas-container"></div>

                <!-- Bottom Timeline -->
                <div class="timeline-bar">
                    <span id="time-display" style="font-family: monospace; font-size: 12px;">00.00 / 00.00</span>
                    <input type="range" id="animation-slider" min="0" max="100" value="0" step="0.01">
                </div>
            </div>

            <!-- Right Data Panel -->
            <div class="data-panel">
                <div class="data-header">Bone Quaternions (Local)</div>
                <div class="table-container">
                    <table id="quaternion-table">
                        <thead>
                            <tr>
                                <th>Bone</th>
                                <th>X</th>
                                <th>Y</th>
                                <th>Z</th>
                                <th>W</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <script type="module" src="./demo.js"></script>
</body>

</html>
