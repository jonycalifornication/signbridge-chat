<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignBridge - Local Dev</title>
    <link rel="stylesheet" href="/src/main.css">
</head>
<body>

    <header>
        <div class="logo">
            <span style="font-size: 24px;">👋</span>
            SignBridge
        </div>
        <nav>
            <a href="#" class="active">Негізгі</a>
            <a href="#">Сөздік</a>
            <a href="#">Үйрену</a>
            <a href="#">KazMorph</a>
        </nav>
        <button class="btn-login">➜ Кіру</button>
    </header>

    <main>
        <div class="card">
            <h1>👋 Сәлем!</h1>
            <p>
                Менің атым – AlNaz. Бұл портал – есту қабілеті нашар адамдар үшін арнайы жасалған.
                <br><br>
                Выделите любой текст на странице, чтобы проверить работу аватара.
            </p>
            <div class="dots">
                <div class="dot active"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>
    </main>

    <div class="bottom-title">
        <h2>Біздің цифрлық аватарлар</h2>
        <div class="avatar-selector">
            <label for="avatar-select">Аватарды таңдаңыз:</label>
            <select id="avatar-select"></select>
        </div>
    </div>

    <div id="avatar-widget-container"></div>

    <script type="module" src="/src/widget.js"></script>

</body>
</html>
