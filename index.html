<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignBridge Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
    <style>
        /* ─────────────────────────────────────────────────────────────
           Токены. Один источник правды для обеих тем.
           Акцент — янтарь из руки в логотипе, а не дежурная бирюза.
           ───────────────────────────────────────────────────────────── */
        :root {
            color-scheme: light;

            --paper:      #F2F1EE;
            --surface:    #FFFFFF;
            --surface-2:  #EAE8E3;
            --line:       #DEDBD4;
            --line-soft:  #E9E7E1;
            --ink:        #16181D;
            --ink-soft:   #6B675F;
            --ink-faint:  #9A958B;
            --accent:     #A96410;
            --accent-2:   #8A5009;
            --accent-wash:rgba(169, 100, 16, 0.10);
            --danger:     #B4291F;
            --danger-wash:#FBEEEC;
            --ok:         #2F7D4F;

            --shadow-sm: 0 1px 2px rgba(22, 24, 29, .06);
            --shadow-md: 0 6px 24px -8px rgba(22, 24, 29, .18);
            --shadow-lg: 0 20px 48px -16px rgba(22, 24, 29, .26);

            /* Шаг сетки — 4px. Ничего между значениями. */
            --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px;
            --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px;

            --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-full: 999px;

            /* Пропорции кадра рендера (src/headless/frame-size.js). Держим
               контейнер и скелетон в них, иначе видео обрежется по бокам —
               ровно там, где разведённые руки. */
            --video-aspect: 5 / 4;

            --font-ui:   'Golos Text', system-ui, sans-serif;
            --font-mono: 'IBM Plex Mono', ui-monospace, monospace;

            /* Совместимость со старыми именами — их держит существующая разметка */
            --bg-chat: var(--paper);
            --bg-sidebar: var(--paper);
            --border-color: var(--line);
            --text-main: var(--ink);
            --text-muted: var(--ink-soft);
            --input-bg: var(--surface);
            --user-bubble: var(--surface-2);
            --accent-light: var(--accent-wash);
            --accent-hover: var(--accent-2);
        }

        body[data-theme="dark"] {
            color-scheme: dark;

            --paper:      #15171C;
            --surface:    #1C1F26;
            --surface-2:  #23272F;
            --line:       #2C313A;
            --line-soft:  #23272F;
            --ink:        #E8E6E1;
            --ink-soft:   #9B968D;
            --ink-faint:  #6E6960;
            --accent:     #E9A93E;
            --accent-2:   #F2BC5E;
            --accent-wash:rgba(233, 169, 62, 0.14);
            --danger:     #E97C72;
            --danger-wash:#2A1614;
            --ok:         #62B98A;

            --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
            --shadow-md: 0 6px 24px -8px rgba(0, 0, 0, .55);
            --shadow-lg: 0 20px 48px -16px rgba(0, 0, 0, .7);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            font-family: var(--font-ui);
            font-size: 15px;
            line-height: 1.5;
            background: var(--paper);
            color: var(--ink);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
            border-radius: var(--r-sm);
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
                scroll-behavior: auto !important;
            }
        }

        .app-layout { display: flex; height: 100vh; width: 100vw; }

        /* ── Боковая панель ─────────────────────────────────────────── */
        .sidebar {
            width: 264px; flex-shrink: 0;
            background: var(--paper);
            border-right: 1px solid var(--line);
            display: flex; flex-direction: column;
            padding: var(--s3);
            gap: var(--s2);
        }

        .new-chat-btn {
            display: flex; align-items: center; gap: var(--s2);
            width: 100%; padding: 10px var(--s3);
            font-family: var(--font-ui); font-size: 14px; font-weight: 500;
            background: var(--surface); color: var(--ink);
            border: 1px solid var(--line); border-radius: var(--r-sm);
            cursor: pointer; transition: border-color .15s, background .15s;
        }
        .new-chat-btn:hover { border-color: var(--ink-faint); }
        .new-chat-btn svg { width: 16px; height: 16px; color: var(--ink-soft); }

        .history-list {
            flex: 1; overflow-y: auto; overflow-x: hidden;
            display: flex; flex-direction: column; gap: 1px;
            margin: var(--s2) calc(var(--s2) * -1) 0;
            padding: 0 var(--s2);
        }
        .history-item {
            font-size: 13px; color: var(--ink-soft);
            padding: var(--s2) var(--s2); border-radius: var(--r-sm);
            cursor: pointer; display: flex; align-items: center;
            justify-content: space-between; gap: var(--s2);
            transition: background .12s, color .12s;
        }
        .history-item-title { flex: 1; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; }
        .history-item:hover { background: var(--surface-2); color: var(--ink); }
        .history-item.active { background: var(--surface-2); color: var(--ink); font-weight: 500; }
        .history-item-actions { display: flex; gap: var(--s1); opacity: 0; transition: opacity .12s; }
        .history-item:hover .history-item-actions,
        .history-item:focus-within .history-item-actions { opacity: 1; }
        .action-btn { color: var(--ink-faint); border: none; background: transparent; cursor: pointer; line-height: 0; padding: 2px; border-radius: 4px; transition: color .12s; }
        .action-btn:hover { color: var(--ink); }
        .action-btn.del:hover { color: var(--danger); }

        /* Переключатели внизу панели — тихий служебный блок */
        .mode-toggle {
            display: flex; gap: 2px; padding: 2px;
            background: var(--surface-2); border-radius: var(--r-sm);
            margin-top: auto;
        }
        .mode-toggle-btn {
            flex: 1; padding: 7px 0;
            font-family: var(--font-ui); font-size: 12px; font-weight: 500;
            border: none; border-radius: 6px; cursor: pointer;
            background: transparent; color: var(--ink-soft);
            display: flex; align-items: center; justify-content: center; gap: 5px;
            transition: background .15s, color .15s;
        }
        .mode-toggle-btn:hover { color: var(--ink); }
        .mode-toggle-btn.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
        .mode-toggle-btn svg { width: 13px; height: 13px; flex-shrink: 0; }

        .theme-toggle {
            display: flex; align-items: center; gap: var(--s2);
            padding: var(--s2) var(--s3); border-radius: var(--r-sm);
            cursor: pointer; background: transparent; border: none;
            color: var(--ink-soft); font-family: var(--font-ui);
            font-size: 13px; font-weight: 500; transition: background .12s, color .12s;
        }
        .theme-toggle:hover { background: var(--surface-2); color: var(--ink); }
        .theme-toggle svg { width: 14px; height: 14px; }

        /* ── Рабочая область ────────────────────────────────────────── */
        .main-col { flex: 1; display: flex; flex-direction: column; position: relative; min-width: 0; background: var(--surface); }
        body[data-theme="dark"] .main-col { background: var(--paper); }

        .chat-messages {
            flex: 1; overflow-y: auto; padding: var(--s6) var(--s5);
            display: flex; flex-direction: column; scroll-behavior: smooth;
        }

        /* ── Стартовый экран ────────────────────────────────────────── */
        .welcome-screen {
            position: absolute; inset: 0; z-index: 5;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: var(--s5);
            background: var(--surface);
            transition: opacity .4s ease, visibility .4s;
        }
        body[data-theme="dark"] .welcome-screen { background: var(--paper); }
        #particle-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; opacity: .22; }
        .welcome-content { position: relative; z-index: 1; max-width: 460px; }
        .welcome-screen .logo { margin-bottom: var(--s3); }
        .welcome-screen .logo svg { width: 40px; height: 40px; }

        /* Тезис стартового экрана: что именно делает продукт.
           Слово сверху, глосс снизу, под глоссом — та же линия статуса,
           что и в ответах. Пустой экран объясняет нотацию заранее. */
        .hero-gloss {
            display: inline-flex; align-items: flex-end; gap: var(--s5);
            margin-top: var(--s5); padding: var(--s4) var(--s5);
            border: 1px solid var(--line); border-radius: var(--r-md);
            background: var(--surface);
        }
        body[data-theme="dark"] .hero-gloss { background: var(--surface); }
        .hero-gloss .gloss-token .gloss-src { font-size: 12px; }
        .hero-gloss .gloss-token .gloss-out { font-size: 17px; }
        .hero-caption {
            display: block; margin-top: var(--s3);
            font-family: var(--font-mono); font-size: 11px;
            letter-spacing: .06em; text-transform: uppercase;
            color: var(--ink-soft);
        }
        .welcome-screen h2 {
            font-size: 28px; font-weight: 600; letter-spacing: -.02em;
            color: var(--ink); margin-bottom: var(--s2);
        }
        .welcome-screen p { color: var(--ink-soft); font-size: 15px; margin: 0 auto; }

        .quick-phrases {
            display: flex; flex-wrap: wrap; gap: var(--s2);
            justify-content: center; margin-top: var(--s5);
        }
        .phrase-chip {
            padding: 7px var(--s3); border-radius: var(--r-full);
            border: 1px solid var(--line); background: transparent;
            color: var(--ink-soft); font-family: var(--font-ui);
            font-size: 13px; font-weight: 500; cursor: pointer;
            transition: border-color .15s, color .15s, background .15s;
        }
        .phrase-chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-wash); }

        /* ── Сообщения ──────────────────────────────────────────────── */
        .message-row {
            position: relative; z-index: 10; display: flex;
            margin: 0 auto var(--s6); max-width: 720px; width: 100%;
            flex-shrink: 0; animation: riseIn .32s cubic-bezier(.16, 1, .3, 1) both;
        }
        .message-row.user { justify-content: flex-end; }
        @keyframes riseIn { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

        .bubble { font-size: 15px; line-height: 1.55; position: relative; word-break: break-word; }
        .message-row.user .bubble {
            background: var(--surface-2); color: var(--ink);
            padding: 10px var(--s4); border-radius: var(--r-md);
            border-bottom-right-radius: var(--s1); max-width: 78%;
        }
        .message-row.assistant .bubble { background: transparent; width: 100%; }

        /* ── Сигнатура: интерлинеарная запись глосс ──────────────────
           Слово сверху, глосс снизу, под глоссом — линия статуса.
           Сплошная = жест найден, пунктир = дактиль (буква за буквой),
           без линии = показать нечем. Цвет только дублирует форму. */
        .gloss-preview {
            margin-bottom: var(--s4); padding: var(--s3) var(--s4);
            background: var(--surface-2); border-radius: var(--r-md);
            display: flex; flex-wrap: wrap; align-items: flex-end;
            gap: var(--s3) var(--s4); line-height: 1.3;
        }
        body[data-theme="dark"] .gloss-preview { background: var(--surface); }

        .gloss-header { display: inline-flex; align-items: center; gap: var(--s1); align-self: center; }
        .gloss-label {
            font-family: var(--font-mono); font-size: 10px; font-weight: 500;
            text-transform: uppercase; letter-spacing: .08em; color: var(--ink-faint);
        }

        .gloss-token {
            display: inline-flex; flex-direction: column; gap: 3px;
            font-family: var(--font-mono);
        }
        .gloss-token .gloss-src {
            font-family: var(--font-ui); font-size: 11px;
            /* Значимый текст: --ink-faint даёт всего 3:1, поэтому --ink-soft */
            color: var(--ink-soft); letter-spacing: 0;
        }
        .gloss-token .gloss-out {
            font-size: 13px; font-weight: 500; letter-spacing: .02em;
            color: var(--ink); padding-bottom: 4px;
            border-bottom: 2px solid transparent;
        }
        .gloss-token.matched  .gloss-out { border-bottom-color: var(--ok); }
        .gloss-token.dactyl   .gloss-out { border-bottom-style: dotted; border-bottom-width: 3px; border-bottom-color: var(--accent); color: var(--accent); }
        .gloss-token.partial-dactyl .gloss-out { border-bottom-style: dashed; border-bottom-color: var(--accent); }
        .gloss-token.missing  .gloss-out,
        .gloss-token.unmatched .gloss-out { color: var(--ink-faint); text-decoration: line-through; text-decoration-color: var(--line); }

        .gloss-help-wrap { position: relative; display: inline-flex; }
        .gloss-help {
            width: 16px; height: 16px; border-radius: var(--r-full);
            border: 1px solid var(--line); background: transparent; color: var(--ink-faint);
            font: 500 10px/1 var(--font-mono); cursor: help;
            display: inline-flex; align-items: center; justify-content: center; padding: 0;
        }
        .gloss-help:hover, .gloss-help:focus-visible { color: var(--accent); border-color: var(--accent); }
        .gloss-legend {
            position: absolute; top: calc(100% + var(--s2)); left: 0; z-index: 40;
            min-width: 200px; padding: var(--s3);
            border: 1px solid var(--line); border-radius: var(--r-sm);
            background: var(--surface); box-shadow: var(--shadow-lg);
            opacity: 0; visibility: hidden; transform: translateY(-4px);
            transition: opacity .15s, visibility .15s, transform .15s;
        }
        .gloss-help-wrap:hover .gloss-legend, .gloss-help:focus-visible + .gloss-legend { opacity: 1; visibility: visible; transform: none; }
        .gloss-legend-title { display: block; font-size: 11px; font-weight: 600; color: var(--ink); margin-bottom: var(--s2); }
        .gloss-legend-item { display: flex; align-items: center; gap: var(--s2); color: var(--ink-soft); font-size: 12px; white-space: nowrap; margin-top: var(--s1); }
        .gloss-legend-swatch { width: 18px; height: 0; flex-shrink: 0; border-bottom: 2px solid var(--line); }
        .gloss-legend-swatch.matched { border-bottom-color: var(--ok); }
        .gloss-legend-swatch.dactyl { border-bottom: 3px dotted var(--accent); }
        .gloss-legend-swatch.partial-dactyl { border-bottom: 2px dashed var(--accent); }
        .gloss-legend-swatch.missing { border-bottom-color: var(--line); }

        /* ── Видео и его состояния ──────────────────────────────────── */
        .video-wrapper { position: relative; width: 288px; margin-top: var(--s2); }
        .video-container, .skeleton-container {
            width: 288px; aspect-ratio: var(--video-aspect); border-radius: var(--r-md);
            overflow: hidden; position: relative;
            border: 1px solid var(--line); background: var(--surface-2);
        }
        .video-wrapper .video-container { width: 100%; margin-top: 0; }
        .skeleton-container { margin-top: var(--s2); display: flex; flex-direction: column; align-items: center; justify-content: center; isolation: isolate; }
        .skeleton-shimmer { position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent); background-size: 200% 100%; animation: shimmer 1.6s infinite linear; pointer-events: none; z-index: 1; }
        body[data-theme="dark"] .skeleton-shimmer { background: linear-gradient(90deg, transparent, rgba(255,255,255,.05), transparent); background-size: 200% 100%; }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

        .video-container { animation: riseIn .3s cubic-bezier(.16, 1, .3, 1); }
        .video-container video { width: 100%; height: 100%; display: block; object-fit: contain; }
        .download-btn {
            position: absolute; bottom: var(--s2); right: var(--s2);
            background: rgba(0,0,0,.66); color: #fff; border: none;
            border-radius: var(--r-sm); padding: 6px var(--s3);
            font-family: var(--font-ui); font-size: 12px; font-weight: 500;
            cursor: pointer; text-decoration: none; backdrop-filter: blur(6px);
        }
        .download-btn:hover { background: rgba(0,0,0,.82); }

        .speed-controls { display: flex; gap: var(--s1); margin-top: var(--s2); }
        .speed-btn {
            padding: 3px 9px; border-radius: 6px; border: 1px solid var(--line);
            background: transparent; color: var(--ink-soft);
            font-family: var(--font-mono); font-size: 11px; cursor: pointer;
            transition: border-color .12s, color .12s;
        }
        .speed-btn:hover { color: var(--ink); border-color: var(--ink-faint); }
        .speed-btn.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

        .gen-time { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); margin-top: var(--s2); display: flex; align-items: center; gap: var(--s1); }

        .expired-block { width: 288px; background: var(--surface-2); border: 1px dashed var(--line); padding: var(--s5) var(--s4); border-radius: var(--r-md); text-align: center; margin-top: var(--s2); }
        .expired-block p { color: var(--ink-soft); font-size: 13px; margin-bottom: var(--s3); }
        .regenerate-btn { background: var(--ink); color: var(--paper); border: none; padding: 8px var(--s4); border-radius: var(--r-sm); font-family: var(--font-ui); font-size: 13px; font-weight: 500; cursor: pointer; }
        .regenerate-btn:hover { background: var(--accent); }

        .error-text { color: var(--danger); font-size: 14px; background: var(--danger-wash); padding: var(--s2) var(--s3); border-radius: var(--r-sm); border: 1px solid var(--line); display: inline-block; margin-top: var(--s2); }

        .typing-dots { display: flex; gap: 5px; padding: var(--s2) 0; }
        .typing-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-faint); animation: dotBounce 1.4s ease-in-out infinite; }
        .typing-dots span:nth-child(2) { animation-delay: .2s; }
        .typing-dots span:nth-child(3) { animation-delay: .4s; }
        @keyframes dotBounce { 0%, 80%, 100% { transform: scale(.6); opacity: .4; } 40% { transform: scale(1); opacity: 1; } }

        /* Прогресс рендера */
        .status-container { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: var(--s3); color: var(--ink); font-size: 13px; text-align: center; padding: 0 var(--s4); }
        .spinner { width: 22px; height: 22px; border: 2px solid var(--line); border-bottom-color: var(--accent); border-radius: 50%; animation: rotation 1s linear infinite; }
        @keyframes rotation { to { transform: rotate(360deg); } }
        .status-text-anim { display: inline-block; }

        .stepper { display: flex; align-items: center; width: 224px; }
        .step-node { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); flex-shrink: 0; z-index: 2; transition: all .3s; }
        .step-node.active { border-color: var(--accent); color: var(--accent); }
        .step-node.done { border-color: var(--ok); background: var(--ok); color: #fff; }
        .step-line { flex: 1; height: 1.5px; background: var(--line); position: relative; overflow: hidden; }
        .step-line-fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--ok); transition: width .5s cubic-bezier(.16, 1, .3, 1); }
        .step-labels { display: flex; justify-content: space-between; width: 224px; margin: var(--s1) 0 var(--s2); }
        .step-label { font-size: 10px; color: var(--ink-faint); text-align: center; width: 52px; }
        .step-label.active { color: var(--accent); font-weight: 600; }
        .step-label.done { color: var(--ok); }

        .confetti-container { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
        .confetti-piece { position: absolute; width: 6px; height: 6px; top: -10px; opacity: 0; animation: confettiFall 1.2s cubic-bezier(.25, .46, .45, .94) forwards; }
        @keyframes confettiFall { 0% { transform: translateY(0) rotate(0); opacity: 1; } 80% { opacity: 1; } 100% { transform: translateY(320px) rotate(720deg) scale(.3); opacity: 0; } }

        /* ── Поле ввода ─────────────────────────────────────────────── */
        .input-area { padding: var(--s4) var(--s5) var(--s5); display: flex; justify-content: center; position: relative; z-index: 10; }
        .input-wrapper {
            max-width: 720px; width: 100%; position: relative;
            background: var(--surface); border: 1px solid var(--line);
            border-radius: var(--r-lg); padding: var(--s3) 152px var(--s3) var(--s4);
            box-shadow: var(--shadow-sm);
            transition: border-color .15s, box-shadow .15s;
        }
        .input-wrapper:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash); }
        body[data-theme="dark"] .input-wrapper { background: var(--surface); }

        textarea {
            width: 100%; border: none; outline: none; resize: none;
            font-family: var(--font-ui); font-size: 15px; line-height: 1.5;
            color: var(--ink); background: transparent;
            max-height: 200px; min-height: 24px; padding: 0;
        }
        textarea:focus, textarea:focus-visible { outline: none; }
        textarea::placeholder { color: var(--ink-faint); }

        .icon-toggle-btn {
            position: absolute; bottom: 10px; width: 30px; height: 30px;
            border-radius: var(--r-sm); background: transparent; border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--ink-faint); transition: background .12s, color .12s;
        }
        .icon-toggle-btn:hover, .icon-toggle-btn.active { background: var(--surface-2); color: var(--ink); }
        .icon-toggle-btn svg { width: 17px; height: 17px; }
        #bg-selector-btn { right: 46px; }
        #avatar-selector-btn { right: 82px; }
        .lang-flag { position: absolute; right: 120px; bottom: 15px; font-size: 15px; pointer-events: none; }

        .send-btn {
            position: absolute; right: 10px; bottom: 10px;
            width: 30px; height: 30px; border-radius: var(--r-sm);
            background: var(--ink); color: var(--paper); border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; overflow: hidden; transition: background .15s, opacity .15s;
        }
        .send-btn:hover:not(:disabled) { background: var(--accent); }
        .send-btn:disabled { background: var(--surface-2); color: var(--ink-faint); cursor: not-allowed; }
        .send-btn svg { width: 15px; height: 15px; position: relative; z-index: 1; }
        .ripple { position: absolute; border-radius: 50%; background: rgba(255,255,255,.35); transform: scale(0); animation: rippleAnim .6s ease-out forwards; pointer-events: none; }
        @keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }

        .char-counter { position: absolute; bottom: -18px; right: var(--s4); font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); opacity: 0; transition: opacity .15s, color .15s; pointer-events: none; }
        .input-wrapper:focus-within .char-counter { opacity: 1; }
        .char-counter.warn { color: var(--accent); }
        .char-counter.danger { color: var(--danger); }

        /* Всплывающие панели */
        .bg-popover, .avatar-popover {
            position: absolute; background: var(--surface);
            border: 1px solid var(--line); border-radius: var(--r-md);
            box-shadow: var(--shadow-lg); z-index: 50;
            opacity: 0; visibility: hidden; transform: translateY(6px);
            transition: opacity .15s, visibility .15s, transform .15s;
        }
        .bg-popover.show, .avatar-popover.show { opacity: 1; visibility: visible; transform: none; }
        .bg-popover { right: 46px; bottom: 46px; padding: var(--s1); display: flex; gap: 2px; }
        .avatar-popover { right: 82px; bottom: 46px; padding: var(--s3); width: 216px; display: flex; flex-direction: column; gap: var(--s2); }

        .color-option { border: none; background: transparent; border-radius: var(--r-sm); padding: 5px; cursor: pointer; transition: background .12s; }
        .color-option:hover { background: var(--surface-2); }
        .color-option.active { background: var(--surface-2); box-shadow: inset 0 0 0 1.5px var(--accent); }
        .color-swatch { display: block; width: 20px; height: 20px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }

        .avatar-card { display: flex; align-items: center; gap: var(--s2); padding: var(--s2); border-radius: var(--r-sm); border: 1px solid var(--line); cursor: pointer; transition: border-color .15s, background .15s; }
        .avatar-card.active { border-color: var(--accent); background: var(--accent-wash); }
        .avatar-img { width: 30px; height: 30px; border-radius: 50%; background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-size: 15px; }
        .avatar-info b { font-size: 13px; display: block; color: var(--ink); font-weight: 500; }
        .avatar-info span { font-size: 11px; color: var(--ink-soft); }
        .coming-soon { padding: var(--s2); font-size: 11px; color: var(--ink-faint); text-align: center; border: 1px dashed var(--line); border-radius: var(--r-sm); }

        .scroll-bottom-btn {
            position: absolute; bottom: 96px; right: var(--s5); z-index: 15;
            width: 34px; height: 34px; border-radius: 50%;
            background: var(--surface); border: 1px solid var(--line);
            box-shadow: var(--shadow-md); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: var(--ink-soft); opacity: 0; visibility: hidden;
            transform: translateY(6px); transition: all .2s cubic-bezier(.16, 1, .3, 1);
        }
        .scroll-bottom-btn.visible { opacity: 1; visibility: visible; transform: none; }
        .scroll-bottom-btn:hover { color: var(--ink); border-color: var(--ink-faint); }
        .scroll-bottom-btn svg { width: 17px; height: 17px; }
        .scroll-badge { position: absolute; top: -5px; right: -5px; min-width: 17px; height: 17px; border-radius: var(--r-full); background: var(--accent); color: #fff; font-family: var(--font-mono); font-size: 10px; display: flex; align-items: center; justify-content: center; padding: 0 4px; }

        /* ── Мобильные ──────────────────────────────────────────────── */
        .mobile-menu-btn { display: none; position: fixed; top: var(--s3); left: var(--s3); z-index: 100; width: 34px; height: 34px; border-radius: var(--r-sm); background: var(--surface); border: 1px solid var(--line); cursor: pointer; color: var(--ink); align-items: center; justify-content: center; }
        .mobile-menu-btn svg { width: 17px; height: 17px; }
        .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 90; }

        @media (max-width: 860px) {
            .sidebar { position: fixed; left: -280px; top: 0; bottom: 0; width: 264px; z-index: 95; transition: left .25s ease; box-shadow: var(--shadow-lg); }
            .sidebar.open { left: 0; }
            .sidebar-overlay.open { display: block; }
            .mobile-menu-btn { display: flex; }
            .chat-messages { padding: var(--s7) var(--s4) var(--s4); }
            .input-area { padding: var(--s3) var(--s4) var(--s4); }
            .scroll-bottom-btn { right: var(--s4); }
            .welcome-screen h2 { font-size: 24px; }
            .video-container, .skeleton-container, .video-wrapper, .expired-block { width: 100%; max-width: 288px; }
        }
    </style>
</head>
<body>
    <button class="mobile-menu-btn" id="mobile-menu-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <div class="app-layout">
        <!-- Sidebar -->
        <div class="sidebar">
            <button id="new-chat-btn" class="new-chat-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                <span data-i18n="newChat">Жаңа аударма</span>
            </button>
            
            <div class="history-list" id="history-list">
                <!-- History injects here via JS -->
            </div>

            <div class="mode-toggle" id="mode-toggle">
                <button class="mode-toggle-btn active" data-mode="normal">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    <span data-i18n="modeNormal">Қарапайым</span>
                </button>
                <button class="mode-toggle-btn" data-mode="preview">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                    <span data-i18n="modePreview">Тексеру</span>
                </button>
            </div>
            
            <button id="lang-toggle" class="theme-toggle" style="margin-bottom: 4px;">
                <span style="font-size: 16px;">🇰🇿</span>
                <span data-i18n="langToggle">Қазақша</span>
            </button>

            <button id="theme-toggle" class="theme-toggle">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sun-icon"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                <span data-i18n="themeToggle">Түнгі режим</span>
            </button>
        </div>

        <!-- Main Workspace -->
        <div class="main-col">
            <div class="welcome-screen" id="welcome-screen">
                <canvas id="particle-canvas"></canvas>
                <div class="welcome-content">
                    <div class="logo">
                        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <g class="hand-ily">
                                <!-- Palm -->
                                <rect x="35" y="52" width="30" height="28" rx="6" fill="#FBBF24"/>
                                <path d="M35 65 Q32 72 35 80" stroke="#F59E0B" stroke-width="1" fill="none"/>
                                <!-- Thumb (out to the side) -->
                                <rect x="24" y="50" width="14" height="7" rx="3.5" fill="#FCD34D"/>
                                <circle cx="24" cy="53.5" r="3.5" fill="#FCD34D"/>
                                <!-- Pinky finger (up) -->
                                <rect x="58" y="22" width="7" height="32" rx="3.5" fill="#FCD34D"/>
                                <circle cx="61.5" cy="22" r="3.5" fill="#FCD34D"/>
                                <!-- Index finger (up) -->
                                <rect x="35" y="20" width="7" height="34" rx="3.5" fill="#FBBF24"/>
                                <circle cx="38.5" cy="20" r="3.5" fill="#FBBF24"/>
                                <!-- Ring finger (folded) -->
                                <rect x="51" y="44" width="7" height="12" rx="3.5" fill="#F59E0B"/>
                                <!-- Middle finger (folded) -->
                                <rect x="43" y="43" width="7" height="13" rx="3.5" fill="#F59E0B"/>
                                <!-- Wrist -->
                                <rect x="38" y="78" width="24" height="8" rx="4" fill="#FBBF24"/>
                            </g>
                        </svg>
                    </div>
                    <h2>SignBridge AI</h2>
                    <p data-i18n="welcomeText">Кез келген тілде мәтін жазыңыз, 3D-аватар оны ым тіліне аударады.</p>

                    <div class="hero-gloss" aria-hidden="true">
                        <span class="gloss-token matched">
                            <span class="gloss-src" data-i18n="heroSrcA">сәлем</span>
                            <span class="gloss-out" data-i18n="heroGlossA">СӘЛЕМ</span>
                        </span>
                        <span class="gloss-token matched">
                            <span class="gloss-src" data-i18n="heroSrcB">достар</span>
                            <span class="gloss-out" data-i18n="heroGlossB">ДОС</span>
                        </span>
                    </div>
                    <span class="hero-caption" data-i18n="heroCaption">Сөз — үстінде, ым — астында</span>
                    <div class="quick-phrases" id="quick-phrases">
                        <button class="phrase-chip" data-text="Сәлем" data-text-ru="Привет" data-i18n="chipHello">👋 Сәлем</button>
                        <button class="phrase-chip" data-text="Рахмет" data-text-ru="Спасибо" data-i18n="chipThanks">🙏 Рахмет</button>
                        <button class="phrase-chip" data-text="Қалдарыңыз қалай?" data-text-ru="Как дела?" data-i18n="chipHowAreYou">😊 Қалдарыңыз қалай?</button>
                        <button class="phrase-chip" data-text="Көмектесіңіз" data-text-ru="Помогите" data-i18n="chipHelp">🆘 Көмектесіңіз</button>
                        <button class="phrase-chip" data-text="Сау болыңыз" data-text-ru="До свидания" data-i18n="chipBye">✌️ Сау болыңыз</button>
                    </div>
                </div>
            </div>

            <div class="chat-messages" id="chat-messages">
            </div>

            <button class="scroll-bottom-btn" id="scroll-bottom-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>

            <div class="input-area">
                <div class="input-wrapper">
                    <textarea id="gloss-input" rows="1" data-i18n-placeholder="inputPlaceholder" placeholder="Фразаны енгізіңіз..." maxlength="500"></textarea>
                    
                    <span id="lang-flag" class="lang-flag"></span>

                    <button id="avatar-selector-btn" class="icon-toggle-btn" data-i18n-title="avatarSelect" title="Кейіпкерді таңдау">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    </button>

                    <div id="avatar-popover" class="avatar-popover">
                        <div class="avatar-card active" data-avatar="Aibek">
                            <div class="avatar-img">👤</div>
                            <div class="avatar-info">
                                <b data-i18n="avatarName">Айназ</b>
                                <span data-i18n="avatarDesc">Негізгі модель</span>
                            </div>
                        </div>
                        <div class="coming-soon" data-i18n="comingSoon">
                            Көбірек аватарлар жақында...
                        </div>
                    </div>

                    <button id="bg-selector-btn" class="icon-toggle-btn" data-i18n-title="bgSelect" title="Фон түсі">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                    </button>
                    
                    <div id="bg-popover" class="bg-popover">
                        <button class="color-option active" data-color="white" data-i18n-title="colorWhite" title="Ақ"><span class="color-swatch" style="background: white;"></span></button>
                        <button class="color-option" data-color="green" data-i18n-title="colorGreen" title="Жасыл хромакей"><span class="color-swatch" style="background: #00FF00;"></span></button>
                        <button class="color-option" data-color="#1F2937" data-i18n-title="colorDark" title="Қараңғы"><span class="color-swatch" style="background: #1F2937;"></span></button>
                        <button class="color-option" data-color="transparent" data-i18n-title="colorTransparent" title="Мөлдір"><span class="color-swatch" style="background: repeating-conic-gradient(#e5e7eb 0% 25%, white 0% 50%) 50% / 8px 8px;"></span></button>
                    </div>

                    <button id="send-btn" class="send-btn" disabled>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                    <span class="char-counter" id="char-counter">0/500</span>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/src/video-generator/main.js"></script>
    <script>
        // Mobile sidebar toggle
        const menuBtn = document.getElementById('mobile-menu-btn');
        const overlay = document.getElementById('sidebar-overlay');
        const sidebar = document.querySelector('.sidebar');
        if (menuBtn && sidebar && overlay) {
            menuBtn.addEventListener('click', () => {
                sidebar.classList.toggle('open');
                overlay.classList.toggle('open');
            });
            overlay.addEventListener('click', () => {
                sidebar.classList.remove('open');
                overlay.classList.remove('open');
            });
        }
    </script>

</body>
</html>
