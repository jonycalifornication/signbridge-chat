<!DOCTYPE html>
<html lang="kk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignBridge - Local Dev</title>
    <link rel="stylesheet" href="/src/main.css">
</head>

<body>

    <header>
        <div class="logo">
            <span style="font-size: 24px;">👋</span>
            SignBridge
        </div>
        <nav>
            <a href="#" class="active">Негізгі</a>
            <a href="#">Сөздік</a>
            <a href="#">Үйрену</a>
            <a href="#">KazMorph</a>
        </nav>
        <button class="btn-login">➜ Кіру</button>
    </header>

    <main>
        <div class="card">
            <h1>👋 Сәлем!</h1>
            <p>
                Менің атым – AlNaz. Бұл портал – есту қабілеті нашар адамдар үшін арнайы жасалған.
                <br><br>
                <strong>🎭 Попробуйте интерактивность!</strong>
                <br>
                Выделите слова: <span style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
                                                padding: 4px 8px; 
                                                border-radius: 6px; 
                                                color: white; 
                                                font-weight: bold; 
                                                cursor: pointer;
                                                user-select: text;">hello</span>
                или
                <span style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); 
                              padding: 4px 8px; 
                              border-radius: 6px; 
                              color: white; 
                              font-weight: bold; 
                              cursor: pointer;
                              user-select: text;">idle</span>
                чтобы увидеть анимацию аватара!
            </p>
            <div class="dots">
                <div class="dot active"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>
    </main>

    <div class="bottom-title">
        <h2>Біздің цифрлық аватарлар</h2>
        <div class="avatar-selector">
            <label for="avatar-select">Аватарды таңдаңыз:</label>
            <select id="avatar-select"></select>
        </div>
    </div>

    <div id="avatar-widget-container"></div>

    <script type="module" src="/src/widget/index.js"></script>

</body>

</html>
