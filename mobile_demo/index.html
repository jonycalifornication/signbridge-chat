<!DOCTYPE html>
<html lang="kk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0F0F1A">
    <title>SignBridge — Ымдау тілі</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ============================================
           MOBILE-FIRST DARK THEME — SignBridge
           ============================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep: #0F0F1A;
            --bg-card: #1A1A2E;
            --bg-card-hover: #222240;
            --bg-input: #16162B;
            --surface: #252542;
            --border: rgba(255, 255, 255, 0.06);
            --border-active: rgba(99, 102, 241, 0.5);
            --text-primary: #F1F1F6;
            --text-secondary: #8B8BA3;
            --text-tertiary: #5C5C78;
            --accent: #6366F1;
            --accent-glow: rgba(99, 102, 241, 0.25);
            --accent-hover: #818CF8;
            --success: #34D399;
            --warning: #FBBF24;
            --error: #F87171;
            --gradient-accent: linear-gradient(135deg, #6366F1 0%, #8B5CF6 50%, #A78BFA 100%);
            --gradient-surface: linear-gradient(180deg, #1A1A2E 0%, #0F0F1A 100%);
            --radius: 14px;
            --radius-sm: 10px;
            --radius-pill: 50px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        html {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            height: 100%;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* ---- App Shell ---- */
        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 480px;
            margin: 0 auto;
            position: relative;
        }

        /* ---- Header ---- */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            padding-top: max(12px, env(safe-area-inset-top));
            z-index: 10;
            flex-shrink: 0;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-title .logo {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--gradient-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .header-title h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: var(--gradient-accent);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-tertiary);
            padding: 5px 10px;
            background: var(--bg-card);
            border-radius: var(--radius-pill);
            border: 1px solid var(--border);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--error);
            transition: background 0.3s;
        }

        .status-dot.connected {
            background: var(--success);
            box-shadow: 0 0 8px rgba(52, 211, 153, 0.5);
        }

        /* ---- Avatar Area ---- */
        .avatar-section {
            flex: 1;
            position: relative;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #avatar-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #avatar-container canvas {
            display: block;
        }

        /* Speaking indicator */
        .speaking-indicator {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(99, 102, 241, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius-pill);
            border: 1px solid rgba(99, 102, 241, 0.2);
            font-size: 13px;
            font-weight: 500;
            color: var(--accent-hover);
            z-index: 5;
        }

        .speaking-indicator.active {
            display: flex;
            animation: fadeSlideUp 0.3s ease;
        }

        .speaking-bars {
            display: flex;
            gap: 2px;
            align-items: center;
            height: 14px;
        }

        .speaking-bars span {
            width: 3px;
            background: var(--accent);
            border-radius: 2px;
            animation: barPulse 1.2s ease infinite;
        }

        .speaking-bars span:nth-child(1) {
            height: 6px;
            animation-delay: 0s;
        }

        .speaking-bars span:nth-child(2) {
            height: 10px;
            animation-delay: 0.15s;
        }

        .speaking-bars span:nth-child(3) {
            height: 14px;
            animation-delay: 0.3s;
        }

        .speaking-bars span:nth-child(4) {
            height: 8px;
            animation-delay: 0.45s;
        }

        @keyframes barPulse {

            0%,
            100% {
                transform: scaleY(0.4);
            }

            50% {
                transform: scaleY(1);
            }
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* ---- Bottom Panel ---- */
        .bottom-panel {
            flex-shrink: 0;
            padding: 0 12px 12px;
            padding-bottom: max(12px, var(--safe-bottom));
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        /* ---- Word Categories ---- */
        .category-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding: 0 4px;
        }

        .category-tabs::-webkit-scrollbar {
            display: none;
        }

        .category-tab {
            flex-shrink: 0;
            padding: 7px 14px;
            border-radius: var(--radius-pill);
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .category-tab:active {
            transform: scale(0.95);
        }

        .category-tab.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        /* ---- Word Grid ---- */
        .word-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 4px;
            max-height: 110px;
            overflow-y: auto;
            scrollbar-width: thin;
        }

        .word-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .word-chip::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--gradient-accent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .word-chip:active {
            transform: scale(0.95);
        }

        .word-chip:active::before {
            opacity: 0.15;
        }

        .word-chip.playing {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.1);
            box-shadow: 0 0 16px var(--accent-glow);
        }

        .word-chip.playing::before {
            opacity: 0.1;
        }

        .word-chip .emoji {
            font-size: 16px;
            position: relative;
            z-index: 1;
        }

        .word-chip .label {
            position: relative;
            z-index: 1;
        }

        /* ---- Input Area ---- */
        .input-area {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .text-input-wrap {
            flex: 1;
            position: relative;
        }

        .text-input {
            width: 100%;
            padding: 14px 18px;
            padding-right: 44px;
            border-radius: var(--radius);
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
        }

        .text-input::placeholder {
            color: var(--text-tertiary);
        }

        .text-input:focus {
            border-color: var(--border-active);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .send-btn {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--gradient-accent);
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            box-shadow: 0 2px 8px var(--accent-glow);
        }

        .send-btn:active {
            transform: translateY(-50%) scale(0.9);
        }

        .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ---- Toast Notification ---- */
        .toast {
            position: fixed;
            top: max(60px, env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%) translateY(-120%);
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            z-index: 100;
            transition: transform 0.3s ease;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast.error {
            background: rgba(248, 113, 113, 0.15);
            border: 1px solid rgba(248, 113, 113, 0.3);
            color: var(--error);
        }

        .toast.success {
            background: rgba(52, 211, 153, 0.15);
            border: 1px solid rgba(52, 211, 153, 0.3);
            color: var(--success);
        }

        .toast.info {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: var(--accent-hover);
        }

        /* ---- Loading Shimmer ---- */
        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }

            100% {
                background-position: 200% 0;
            }
        }

        .loading-shimmer {
            background: linear-gradient(90deg, var(--bg-card) 25%, var(--surface) 50%, var(--bg-card) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        /* Desktop adaptation */
        @media (min-width: 481px) {
            .app {
                border-left: 1px solid var(--border);
                border-right: 1px solid var(--border);
            }
        }

        /* Landscape phone */
        @media (max-height: 500px) and (orientation: landscape) {
            .avatar-section {
                min-height: 200px;
            }

            .word-grid {
                max-height: 60px;
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="header-title">
                <div class="logo">🤟</div>
                <h1>SignBridge</h1>
            </div>
            <div class="header-status" id="connection-status">
                <span class="status-dot" id="status-dot"></span>
                <span id="status-text">Подключение...</span>
            </div>
        </header>

        <!-- Avatar -->
        <section class="avatar-section">
            <div id="avatar-container"></div>
            <div class="speaking-indicator" id="speaking-indicator">
                <div class="speaking-bars">
                    <span></span><span></span><span></span><span></span>
                </div>
                <span id="speaking-word">—</span>
            </div>
        </section>

        <!-- Bottom Controls -->
        <div class="bottom-panel">
            <!-- Category Tabs -->
            <div class="category-tabs" id="category-tabs">
                <button class="category-tab active" data-category="all">Все</button>
                <button class="category-tab" data-category="greetings">Приветствие</button>
                <button class="category-tab" data-category="family">Семья</button>
                <button class="category-tab" data-category="places">Места</button>
                <button class="category-tab" data-category="body">Тело</button>
            </div>

            <!-- Word Chips -->
            <div class="word-grid" id="word-grid"></div>

            <!-- Text Input -->
            <div class="input-area">
                <div class="text-input-wrap">
                    <input type="text" class="text-input" id="text-input" placeholder="Введите слово или фразу..."
                        autocomplete="off" autocorrect="off" spellcheck="false">
                    <button class="send-btn" id="send-btn" title="Перевести">
                        ▶
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script type="module" src="./main.js"></script>
</body>

</html>
