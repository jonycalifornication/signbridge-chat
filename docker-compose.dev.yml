version: '3.8'

services:
  avatar-widget:
    build:
      context: .
      target: builder
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_API_KEY=sbk_XUQqK17Ui7Gqqe9myqm0S0HGfL52rUWv01KiQMg56S0
      - VITE_API_URL=http://94.131.83.85:8000/api/v1
      - RENDERER_URL=http://avatar-renderer:3003
    command: >
      sh -c "npm install && npm run dev -- --host"

  avatar-renderer:
    build:
      context: .
      dockerfile: Dockerfile.renderer
    ports:
      - "3003:3003"

    environment:
      - APP_URL=http://avatar-widget:5173
      - RENDER_PLAN_API_URL=${BACKEND_URL:-http://host.docker.internal:8000}/api/v1
      - RENDER_PLAN_API_KEY=${VITE_API_KEY:-sbk_XUQqK17Ui7Gqqe9myqm0S0HGfL52rUWv01KiQMg56S0}
      - RENDER_PLAN_LANGUAGE_ID=${VITE_LANGUAGE_ID:-kz_KSL}
    volumes:
      - .:/app
      - /app/node_modules
      - ./api_keys.json:/app/api_keys.json
