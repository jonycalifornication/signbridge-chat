services:
  avatar-widget:
    build:
      context: .
      target: builder
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - RENDERER_URL=http://avatar-renderer:3003
    command: >
      sh -c "npm install && npm run dev -- --host"

  avatar-renderer:
    build:
      context: .
      dockerfile: Dockerfile.renderer
    ports:
      - "3003:3003"

    environment:
      - AVATAR_URL=${AVATAR_URL:-https://widget.signbridge.kz}
      - AVATAR_API_KEY=${AVATAR_API_KEY:?set AVATAR_API_KEY in .env}
      - AVATAR_FILES_URL=${AVATAR_FILES_URL:-http://host.docker.internal:8000}
      - RENDER_PLAN_LANGUAGE_ID=${RENDER_PLAN_LANGUAGE_ID:-KSL}
    volumes:
      - .:/app
      - /app/node_modules
      - ./data:/app/data
      - ./avatar_mirror:/app/avatar_mirror
    extra_hosts:
      - "host.docker.internal:host-gateway"
