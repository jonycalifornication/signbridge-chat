# Разработка: один рендерер на :3003, без входного nginx. Страницы у
# генератора нет — API дёргается напрямую:
#   curl -H "X-API-Key: $GENERATOR_API_KEYS" -H 'content-type: application/json' \
#        -d '{"glosses":"алақан"}' localhost:3003/api/v1/video/generate-async
services:
  avatar-renderer:
    build:
      context: .
      dockerfile: Dockerfile.renderer
    ports:
      - "3003:3003"

    environment:
      - AVATAR_URL=${AVATAR_URL:-https://widget.signbridge.kz}
      - AVATAR_API_KEY=${AVATAR_API_KEY:?set AVATAR_API_KEY in .env}
      - GENERATOR_API_KEYS=${GENERATOR_API_KEYS:?set GENERATOR_API_KEYS in .env}
      - AVATAR_FILES_URL=${AVATAR_FILES_URL:-http://host.docker.internal:8000}
      - RENDER_PLAN_LANGUAGE_ID=${RENDER_PLAN_LANGUAGE_ID:-KSL}
    volumes:
      - .:/app
      - /app/node_modules
      - ./avatar_mirror:/app/avatar_mirror
    extra_hosts:
      - "host.docker.internal:host-gateway"
