<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget Demo & TTS - SignBridge</title>
    <link rel="stylesheet" href="/src/styles/shared.css">
    <style>
        /* Widget specific fixes */
        #json-input {
            font-family: monospace;
            height: 200px;
            resize: vertical;
        }

        .preset-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }

        .avatar-area {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f4f6;
        }

        #avatar-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="/" class="back-link">← Home</a>
                <h2 class="sidebar-title">Widget Demo</h2>
            </div>

            <div class="sidebar-content">
                <div class="control-group">
                    <label class="control-label" for="json-input">JSON Command</label>
                    <textarea id="json-input" class="form-textarea">{
  "animation": "hello",
  "text": "Сәлем",
  "speed": 100,
  "emotions": [
    { "time": 0, "name": "happy", "value": 1.0 },
    { "time": 2000, "name": "happy", "value": 0.0 }
  ]
}</textarea>
                </div>



                <div class="control-group">
                    <button id="play-btn" class="btn btn-primary">
                        ▶ Play Animation
                    </button>
                </div>

                <hr style="border: 0; border-top: 1px solid var(--border-color); width: 100%;">

                <div class="control-group">
                    <label class="control-label">Presets</label>
                    <div class="preset-grid" style="display: flex; flex-direction: column; gap: 8px;">
                        <button class="btn btn-secondary preset-btn"
                            style="justify-content: flex-start; text-align: left;"
                            data-preset='{"animation":"hello", "text":"Сәлем", "speed":100}'>
                            <span style="font-size: 18px;">👋</span>
                            <div>
                                <div style="font-weight: 600;">Hello</div>
                            </div>
                        </button>
                        <button class="btn btn-secondary preset-btn"
                            style="justify-content: flex-start; text-align: left;"
                            data-preset='{"animation":"alaqan", "text":"Алақан", "speed":100}'>
                            <span style="font-size: 18px;">👐</span>
                            <div>
                                <div style="font-weight: 600;">Алақан</div>
                            </div>
                        </button>
                        <button class="btn btn-secondary preset-btn"
                            style="justify-content: flex-start; text-align: left;"
                            data-preset='{"animation":"аурухана", "text":"Аурухана", "speed":100}'>
                            <span style="font-size: 18px;">🏥</span>
                            <div>
                                <div style="font-weight: 600;">Аурухана</div>
                            </div>
                        </button>
                        <button class="btn btn-secondary preset-btn"
                            style="justify-content: flex-start; text-align: left;"
                            data-preset='{"animation":"aga", "text":"Аға", "speed":100}'>
                            <span style="font-size: 18px;">👨</span>
                            <div>
                                <div style="font-weight: 600;">Аға</div>
                            </div>
                        </button>
                        <button class="btn btn-secondary preset-btn"
                            style="justify-content: flex-start; text-align: left;"
                            data-preset='{"animation":"ana", "text":"Ана", "speed":100}'>
                            <span style="font-size: 18px;">👩</span>
                            <div>
                                <div style="font-weight: 600;">Ана</div>
                            </div>
                        </button>
                        <button class="btn btn-secondary preset-btn"
                            style="justify-content: flex-start; text-align: left;"
                            data-preset='{"animation":"сүйек", "text":"Сүйек", "speed":100}'>
                            <span style="font-size: 18px;">🦴</span>
                            <div>
                                <div style="font-weight: 600;">Сүйек</div>
                            </div>
                        </button>
                        <button class="btn btn-secondary preset-btn"
                            style="justify-content: flex-start; text-align: left;"
                            data-preset='{"animation":"аялдама", "text":"Аялдама", "speed":100}'>
                            <span style="font-size: 18px;">🚏</span>
                            <div>
                                <div style="font-weight: 600;">Аялдама</div>
                            </div>
                        </button>
                        <button class="btn btn-secondary preset-btn"
                            style="justify-content: flex-start; text-align: left;"
                            data-preset='{"animation":"мектеп", "text":"Мектеп", "speed":100}'>
                            <span style="font-size: 18px;">🏫</span>
                            <div>
                                <div style="font-weight: 600;">Мектеп</div>
                            </div>
                        </button>
                        <button class="btn btn-secondary preset-btn"
                            style="justify-content: flex-start; text-align: left;"
                            data-preset='{"animation":"театр", "text":"Театр", "speed":100}'>
                            <span style="font-size: 18px;">🎭</span>
                            <div>
                                <div style="font-weight: 600;">Театр</div>
                            </div>
                        </button>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content avatar-area">
            <div id="avatar-container"></div>
        </main>
    </div>

    <script type="module" src="./demo.js"></script>
</body>

</html>
