<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget Demo & TTS - SignBridge</title>
    <link rel="stylesheet" href="/src/styles/shared.css">
    <style>
        /* Widget specific fixes */
        #text-input {
            height: 200px;
            resize: vertical;
        }

        .preset-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }

        /* Search Styles */
        .search-container {
            position: relative;
        }

        #search-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            font-size: 14px;
            transition: all 0.2s ease;
            outline: none;
        }

        #search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .search-results-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            max-height: 250px;
            overflow-y: auto;
            z-index: 100;
            margin-top: 4px;
            animation: fadeIn 0.2s ease-out;
        }

        .search-result-item {
            padding: 10px 14px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-light);
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .search-result-item:hover {
            background: #F8FAFC;
        }

        .search-result-item .gloss-name {
            font-weight: 600;
            color: var(--text-main);
            font-size: 14px;
        }

        .search-result-item .gloss-meta {
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .search-loading {
            padding: 20px;
            text-align: center;
            color: var(--text-tertiary);
            font-size: 13px;
        }

        .search-no-results {
            padding: 20px;
            text-align: center;
            color: var(--text-tertiary);
            font-size: 13px;
        }

        .avatar-area {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f4f6;
        }

        #avatar-container {
            width: 100%;
            height: 100%;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        details > summary::-webkit-details-marker {
            display: none;
        }

        /* Mobile Typography & Layout Adaptation */
        @media (max-width: 1024px) {
            .app-container {
                display: flex !important;
                flex-direction: column-reverse !important;
                height: 100dvh;
            }
            
            .sidebar {
                width: 100% !important;
                height: 55dvh !important;
                max-height: 55dvh !important;
                border-top: 1px solid var(--border-light);
                border-right: none !important;
                border-bottom: none !important;
                padding: 16px !important;
            }

            .avatar-area {
                width: 100%;
                height: 45dvh !important;
                flex: none !important;
                background: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%);
            }
            
            #text-input {
                height: 120px; /* Shorter textarea on mobile */
            }
            
            .preset-category summary {
                padding: 10px 12px !important;
                font-size: 13px !important;
            }

            .preset-grid {
                grid-template-columns: 1fr; /* Make preset buttons full width inside mobile */
            }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="/" class="back-link">← Home</a>
                <h2 class="sidebar-title">Widget Demo</h2>
            </div>

            <div class="sidebar-content">
                <div class="control-group">
                    <label class="control-label" for="text-input">Текст</label>
                    <textarea
                        id="text-input"
                        class="form-textarea"
                        placeholder="Введите слово или предложение"
                    >Мен Айназ</textarea>
                </div>

                <div class="control-group">
                    <label class="control-label" for="search-input">Поиск знаков</label>
                    <div class="search-container">
                        <input
                            type="text"
                            id="search-input"
                            placeholder="Начните вводить слово..."
                            autocomplete="off"
                        >
                        <div id="search-results" class="search-results-dropdown" style="display: none;"></div>
                    </div>
                </div>

                <div class="control-group">
                    <button id="play-btn" class="btn btn-primary">
                        ▶ Показать анимацию
                    </button>
                </div>

                <hr style="border: 0; border-top: 1px solid var(--border-color); width: 100%;">

                <div class="control-group">
                    <label class="control-label">Presets</label>
                    <div id="presets-container" style="display: flex; flex-direction: column; gap: 8px;">
                        <div style="color: #6b7280; font-size: 14px; text-align: center; padding: 10px;">Loading categories...</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content avatar-area">
            <div id="avatar-container"></div>
        </main>
    </div>

    <script type="module" src="./demo.js"></script>
</body>

</html>
